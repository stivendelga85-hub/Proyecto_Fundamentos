spring.application.name=matriculas
server.port=8080
# H2 en archivo: los datos sobreviven al reiniciar. Para PostgreSQL cambia estas 4 lineas.
spring.datasource.url=jdbc:h2:file:./data/matriculas;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
app.cors.origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000
